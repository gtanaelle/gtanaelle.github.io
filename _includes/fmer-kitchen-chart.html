<!-- FrankaKitchen task completion vs. number of tasks (paper Table 2 / Table 8). Hover or tap a column for values. -->
<figure class="viz" id="kitchen-viz">
  <p class="viz__title">FrankaKitchen: normalized task completion (%)</p>
  <p class="viz__sub">Mean over 5 seeds. FMER keeps its completion rate as the task set grows; the baselines fall away.</p>
  <div class="viz__legend">
    <span style="--c: var(--fmer)">FMER</span>
    <span style="--c: var(--base)">Baselines: DPMD, DIPO, SAC</span>
  </div>
  <div class="viz__plot">
    <svg viewBox="0 0 640 300" role="img" aria-label="Line chart of FrankaKitchen task completion rate for FMER, DPMD, DIPO and SAC across 1, 2, 4 and 7 tasks. FMER: 80, 48, 46.5, 40.3. DPMD: 60, 50, 25, 20.6. DIPO: 0, 33, 14.5, 23.1. SAC: 40, 32, 2.5, 12.3."></svg>
    <div class="viz__tip" role="status"></div>
  </div>
  <details>
    <summary>Show all methods as a table</summary>
    <table>
      <thead><tr><th>Method</th><th>N = 1</th><th>N = 2</th><th>N = 4</th><th>N = 7</th></tr></thead>
      <tbody>
        <tr><td>PPO</td><td>2.0</td><td>0.0</td><td>1.0</td><td>8.6</td></tr>
        <tr><td>SAC</td><td>40.0</td><td>32.0</td><td>2.5</td><td>12.3</td></tr>
        <tr><td>TD3</td><td>0.0</td><td>11.0</td><td>15.0</td><td>5.7</td></tr>
        <tr><td>DIPO</td><td>0.0</td><td>33.0</td><td>14.5</td><td>23.1</td></tr>
        <tr><td>DPMD</td><td>60.0</td><td><b>50.0</b></td><td>25.0</td><td>20.6</td></tr>
        <tr><td>QVPO</td><td>0.0</td><td>0.0</td><td>0.0</td><td>18.9</td></tr>
        <tr><td>SAC-Flow</td><td>0.0</td><td>0.0</td><td>0.0</td><td>0.6</td></tr>
        <tr><td>FLAME</td><td>8.0</td><td>10.0</td><td>6.5</td><td>18.3</td></tr>
        <tr><td>FPO</td><td>0.0</td><td>1.0</td><td>0.0</td><td>0.0</td></tr>
        <tr><td><b>FMER</b></td><td><b>80.0</b></td><td>48.0</td><td><b>46.5</b></td><td><b>40.3</b></td></tr>
      </tbody>
    </table>
  </details>
  <script>
  (function () {
    var root = document.getElementById("kitchen-viz");
    var svg = root.querySelector("svg"), tip = root.querySelector(".viz__tip");
    var NS = "http://www.w3.org/2000/svg";
    var cats = ["1 task", "2 tasks", "4 tasks", "7 tasks"];
    var series = [
      { name: "SAC",  v: [40, 32, 2.5, 12.29],   sd: [54.77, 24.90, 3.54, 4.24],  hi: false },
      { name: "DIPO", v: [0, 33, 14.5, 23.14],   sd: [0, 30.33, 21.39, 18.36],    hi: false },
      { name: "DPMD", v: [60, 50, 25, 20.57],    sd: [54.77, 0, 17.68, 8.67],     hi: false },
      { name: "FMER", v: [80, 48, 46.5, 40.29],  sd: [44.72, 4.47, 3.79, 21.03],  hi: true }
    ];
    var W = 640, H = 300, m = { l: 40, r: 64, t: 12, b: 34 };
    var pw = W - m.l - m.r, ph = H - m.t - m.b;
    var x = function (i) { return m.l + pw * (0.06 + 0.88 * i / (cats.length - 1)); };
    var y = function (v) { return m.t + ph * (1 - v / 100); };
    function el(tag, attrs, parent) {
      var e = document.createElementNS(NS, tag);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      (parent || svg).appendChild(e); return e;
    }
    var css = getComputedStyle(root);
    var c = function (n) { return css.getPropertyValue(n).trim(); };
    [0, 25, 50, 75, 100].forEach(function (t) {
      el("line", { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: c("--grid"), "stroke-width": 1 });
      el("text", { x: m.l - 8, y: y(t) + 4, "text-anchor": "end" }).textContent = t;
    });
    cats.forEach(function (lab, i) {
      el("text", { x: x(i), y: H - 10, "text-anchor": "middle" }).textContent = lab;
    });
    var cross = el("line", { y1: m.t, y2: m.t + ph, stroke: c("--muted"), "stroke-width": 1, "stroke-dasharray": "3 3", opacity: 0 });
    series.forEach(function (s) {
      var col = s.hi ? c("--fmer") : c("--base");
      el("polyline", { points: s.v.map(function (v, i) { return x(i) + "," + y(v); }).join(" "),
        fill: "none", stroke: col, "stroke-width": s.hi ? 2.5 : 2, "stroke-linejoin": "round", "stroke-linecap": "round" });
      s.v.forEach(function (v, i) {
        el("circle", { cx: x(i), cy: y(v), r: s.hi ? 5 : 4, fill: col, stroke: c("--surface"), "stroke-width": 2 });
      });
    });
    /* Direct labels at the right end, nudged apart so close values do not collide. */
    var labs = series.map(function (s) { return { s: s, y: y(s.v[s.v.length - 1]) }; })
      .sort(function (a, b) { return a.y - b.y; });
    for (var i = 1; i < labs.length; i++) if (labs[i].y - labs[i - 1].y < 14) labs[i].y = labs[i - 1].y + 14;
    labs.forEach(function (L) {
      var t = el("text", { x: x(cats.length - 1) + 10, y: L.y + 4 });
      t.textContent = L.s.name;
      if (L.s.hi) { t.style.fill = c("--ink"); t.style.fontWeight = 600; }
    });
    /* Hover / tap: one hit column per task set. */
    var colW = pw * 0.88 / (cats.length - 1);
    cats.forEach(function (lab, i) {
      var r = el("rect", { x: x(i) - colW / 2, y: m.t, width: colW, height: ph, fill: "transparent" });
      function show() {
        cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("opacity", 1);
        var rows = series.slice().sort(function (a, b) { return b.v[i] - a.v[i]; }).map(function (s) {
          return '<i style="background:' + (s.hi ? c("--fmer") : c("--base")) + '"></i>' +
            (s.hi ? "<b>" : "") + s.name + ": " + s.v[i].toFixed(1) + "%" + (s.hi ? "</b>" : "") +
            ' <span style="color:' + c("--muted") + '">± ' + s.sd[i].toFixed(1) + "</span>";
        });
        tip.innerHTML = "<b>" + lab + "</b><br>" + rows.join("<br>");
        var box = svg.getBoundingClientRect(), k = box.width / W;
        var left = x(i) * k + 12, tw = tip.offsetWidth;
        if (left + tw > box.width) left = x(i) * k - tw - 12;
        tip.style.left = Math.max(0, left) + "px"; tip.style.top = (m.t * k) + "px"; tip.style.opacity = 1;
      }
      r.addEventListener("pointerenter", show);
      r.addEventListener("pointerdown", show);
      r.addEventListener("pointerleave", function () { tip.style.opacity = 0; cross.setAttribute("opacity", 0); });
    });
  })();
  </script>
</figure>
